# snoopit configuration — copy to `snoopit.config.yaml` and adjust.
#
# This file is safe to commit: snoopit holds no agent credentials.

dataDir: ./data

database:
  # Relative paths resolve against dataDir.
  path: snoopit.db

browser:
  # CDP endpoint of the persistent Chrome (decision D2 in docs/ARCHITECTURE.md).
  # Loopback only. Never bind this to 0.0.0.0 — it grants full control of a browser
  # that carries authenticated sessions.
  cdpUrl: http://127.0.0.1:9222
  # cdp: attach to a Chrome over its debugging port (snoopit-chrome.service).
  # extension: drive a visible Chrome through snoopit's extension, no debugging
  # port (docs/DEPLOYMENT.md §9). The pairing token is read from the variable named
  # by tokenEnv — never written here.
  backend: cdp
  extension:
    port: 9333
    tokenEnv: SNOOPIT_EXTENSION_TOKEN
    connectTimeout: 45s
  defaultProfile: desktop-chrome
  navigationTimeout: 30s

scheduler:
  # Zone schedule windows are read in, for jobs whose schedule names none.
  # Left at UTC, a 08:00-10:00 window on a machine in France fires 1-2 hours late.
  timeZone: UTC

# Limits applied to every run, limit by limit, wherever the workflow's own budget
# is silent: a workflow declaring only `maxPages` still gets the duration, error and
# error limits below. A limit the workflow names always wins.
defaultBudget:
  maxPages: 100
  maxDuration: 20m
  maxErrors: 10
